<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=https://peninsulaequine.com.au/" />
    <link rel="canonical" href="https://peninsulaequine.com.au/" />
    <title>Peninsula Equine has moved</title>
    <script>
      const destination = new URL(window.location.pathname, "https://peninsulaequine.com.au");
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.toString());
    </script>
  </head>
  <body>
    <p>
      Peninsula Equine has moved to
      <a href="https://peninsulaequine.com.au/">peninsulaequine.com.au</a>.
    </p>
  </body>
</html>
