name: Deploy Peninsula Equine to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: peninsula-equine-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build legacy-domain redirect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare route-preserving redirect
        run: |
          mkdir -p dist
          cp retired-site/index.html dist/index.html
          cp retired-site/index.html dist/404.html
          touch dist/.nojekyll

      - name: Verify retirement page
        run: |
          grep -q 'https://peninsulaequine.com.au' dist/index.html
          ! grep -Eqi 'Tubbarubba|info@peninsulaequine\.systems' dist/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
